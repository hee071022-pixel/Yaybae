<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>크리스탈 길드 운영실</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M16 6h32l12 16-28 36L4 22z' fill='%23ffd166'/></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/admin.html"><span id="gem"></span><div><h1>크리스탈 운영실</h1><small>ADMIN · 로또권 &amp; 추첨 관리</small></div></a>
    <div class="who hidden" id="who"><a href="/" class="small">길드원 화면 ↗</a><button class="ghost sm" id="logout">로그아웃</button></div>
  </header>

  <section id="auth" class="hidden">
    <div class="card auth-card">
      <h2>🔐 운영자 로그인</h2>
      <form id="auth-form" class="stack">
        <div><label for="a-id">운영자 아이디</label><input id="a-id" autocomplete="username" value="admin" required></div>
        <div><label for="a-pw">비밀번호</label><input id="a-pw" type="password" autocomplete="current-password" required></div>
        <div class="msg err" id="auth-msg"></div>
        <button class="block lg" id="auth-btn">로그인</button>
      </form>
    </div>
  </section>

  <section id="main" class="hidden">
    <div class="grid">
      <div class="card col-5 stack" id="round-card"></div>

      <div class="card col-7 stack">
        <h2>🎟️ 로또권 지급 / 회수</h2>
        <div class="grid">
          <div class="col-4"><label for="g-amount">수량 (음수 = 회수)</label><input id="g-amount" type="number" value="1" min="-1000" max="1000" step="1"></div>
          <div class="col-8"><label for="g-reason">사유 (길드원에게 보여요)</label><input id="g-reason" maxlength="40" placeholder="예) 주간 출석 보상, 레이드 MVP"></div>
        </div>
        <div class="row">
          <button id="g-selected" disabled>선택한 길드원에게 (0명)</button>
          <button class="cyan" id="g-all">전체 길드원에게</button>
        </div>
        <p class="muted small">회수는 보유 수량 아래로 내려가지 않아요. 표에서 +1 / +5 버튼으로 빠르게 지급할 수도 있어요.</p>
      </div>

      <div class="card col-12">
        <h2>👥 길드원 <span class="sub" id="u-count"></span></h2>
        <div class="row" style="margin-bottom:10px"><input id="u-search" placeholder="닉네임 검색" style="max-width:260px"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th><input type="checkbox" id="u-all" aria-label="전체 선택"></th><th>닉네임</th><th>로또권</th><th>빠른 지급</th><th>가입</th><th>최근 로그인</th><th></th></tr></thead>
            <tbody id="u-body"></tbody>
          </table>
        </div>
      </div>

      <div class="card col-12">
        <h2>📋 응모 현황 <span class="sub"><select id="e-round" style="width:auto;padding:6px 10px"></select></span></h2>
        <div id="entries"></div>
      </div>
    </div>
  </section>
  <footer>💎 크리스탈 길드 운영실</footer>
</div>
<script type="module" src="/admin.js"></script>
</body>
</html>
