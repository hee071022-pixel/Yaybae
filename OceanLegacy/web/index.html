<title>오션 레거시</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* 단일 테마: 밤바다 위 나무 판자 UI. 게임 화면은 캔버스, HUD는 DOM */
:root{
  --sea:#0d4f7a; --ink:#0b1622; --plank:#1d2a3a; --plank2:#2a3b52; --rope:#c9a86a;
  --gold:#ffc94a; --text:#f3efe4; --sub:#a9b6c6; --hp:#5ad16a; --xp:#4fb4ff; --red:#e8584f;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;background:var(--sea)}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;pointer-events:none;z-index:5}
.hud *{pointer-events:auto}
button{font-family:var(--display);color:var(--text);border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* 상단 */
#top{top:calc(env(safe-area-inset-top,0px) + 8px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#statusCard{background:color-mix(in srgb,var(--plank) 88%,transparent);border:1.5px solid #00000080;border-radius:10px;padding:6px 8px;
  display:flex;gap:8px;align-items:center;min-width:0;flex:0 1 300px}
#lv{font-family:var(--display);color:var(--gold);font-size:22px;min-width:52px;text-align:center;line-height:1}
#lv small{display:block;font-size:10px;color:var(--sub);font-family:var(--body)}
.bars{flex:1;display:grid;gap:4px;min-width:0}
.bar{position:relative;height:15px;background:#060b12;border-radius:5px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;transition:width .15s}
.bar span{position:relative;display:block;text-align:center;font-size:10.5px;line-height:15px;font-weight:700;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;white-space:nowrap}
#hpFill{background:var(--hp)} #xpFill{background:var(--xp)}
#rightTop{margin-left:auto;display:grid;gap:6px;justify-items:end}
#beli{font-family:var(--display);color:var(--gold);font-size:19px;text-shadow:0 2px 3px #000;font-variant-numeric:tabular-nums;white-space:nowrap}
#minimap{width:120px;height:46px;border-radius:8px;border:1.5px solid #00000080;background:#0a3554}

/* 퀘스트 + 메뉴 */
#left{top:calc(env(safe-area-inset-top,0px) + 70px);left:max(10px,env(safe-area-inset-left,0px));display:grid;gap:6px;width:min(230px,52vw)}
#quest{background:color-mix(in srgb,var(--plank) 85%,transparent);border-radius:10px;border-left:3px solid var(--gold);padding:6px 9px;font-size:12px;line-height:1.45}
#quest b{font-family:var(--display);color:var(--gold);font-size:14px;font-weight:400}
#quest p{margin:2px 0 0;color:var(--sub)}
#quest p.on{color:var(--text)}
.menuRow{display:flex;gap:6px}
.chip{background:var(--plank);border:1.5px solid #00000080;border-radius:8px;padding:6px 11px;font-size:14px;position:relative}
.dot{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:6px;background:var(--red)}

/* 알림 */
#notify{top:calc(env(safe-area-inset-top,0px) + 110px);left:50%;transform:translateX(-50%);width:min(92vw,520px);display:grid;gap:3px;pointer-events:none;text-align:center}
#notify div{font-family:var(--display);font-size:16px;text-shadow:0 0 4px #000,0 0 4px #000;transition:opacity .5s}
#banner{top:34%;left:0;right:0;text-align:center;font-family:var(--display);font-size:clamp(30px,9vw,56px);pointer-events:none;text-shadow:0 3px 0 #000,0 0 18px currentColor;opacity:0;transition:opacity .4s,transform .4s;transform:scale(.6)}
#banner.show{opacity:1;transform:scale(1)}

/* 무기 슬롯 */
#slots{bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:5px;max-width:calc(100vw - 250px);flex-wrap:wrap}
#slots button{width:58px;height:44px;border-radius:8px;background:#0b1622cc;border:2px solid #ffffff30;font-size:11.5px;line-height:1.15;padding:2px;position:relative}
#slots button.on{border-color:var(--gold);background:#2a3b52ee}
#slots button em{position:absolute;left:4px;top:1px;font-style:normal;font-size:9px;color:var(--sub);font-family:var(--body)}

/* 전투 버튼 */
#pad{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:200px;height:240px}
#pad button{position:absolute;border-radius:50%;background:#0b1622c8;border:2px solid #ffffff38;display:grid;place-items:center;text-align:center;overflow:hidden}
#atk{right:0;bottom:0;width:84px;height:84px;font-size:20px;background:#7a2a22d8 !important;border-color:#ffb0a060 !important}
#dash{right:67px;bottom:-30px;width:52px;height:52px;font-size:13px}
#talk{right:4px;bottom:182px;width:72px;height:40px;border-radius:20px !important;font-size:15px;background:#8a6a1ee8 !important}
.sk{width:58px;height:58px;font-size:10px;line-height:1.1}
.sk b{font-size:17px;color:var(--gold);font-weight:400;display:block}
.sk .cd{position:absolute;inset:0;background:conic-gradient(#000a calc(var(--p,0)*1turn),transparent 0);pointer-events:none}
.sk .ct{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;text-shadow:0 0 3px #000;pointer-events:none}
.sk.locked{opacity:.55}
#skZ{right:22px;bottom:113px}#skX{right:70px;bottom:95px}#skC{right:104px;bottom:55px}#skV{right:113px;bottom:4px}
#help{bottom:calc(env(safe-area-inset-bottom,0px) + 58px);left:max(12px,env(safe-area-inset-left,0px));font-size:11px;color:var(--sub);text-shadow:0 1px 2px #000;pointer-events:none;line-height:1.5}

/* 조이스틱 */
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #ffffff40;background:#ffffff12;z-index:4;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffff55}

/* 패널 */
#veil{position:fixed;inset:0;z-index:20;background:#03070dcc;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
#panel{width:min(440px,100%);max-height:min(82vh,640px);display:flex;flex-direction:column;background:var(--plank);border-radius:14px;border:2px solid var(--rope);box-shadow:0 10px 40px #000a}
#panel header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
#panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--gold);flex:1;text-wrap:balance}
#close{width:34px;height:34px;border-radius:8px;background:var(--red);font-size:16px}
#pbody{overflow-y:auto;padding:4px 14px 14px;display:grid;gap:7px}
.row{display:flex;align-items:center;gap:10px;background:var(--plank2);border-radius:10px;padding:9px 10px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-family:var(--display);font-weight:400;font-size:16px}
.row .t span{display:block;font-size:12px;color:var(--sub);line-height:1.4}
.btn{background:#3d8a52;border-radius:8px;padding:9px 12px;font-size:14px;white-space:nowrap}
.btn.off{background:#4a5566;cursor:default}
.btn.sea{background:#2f72b8}
.btn.big{background:#8b3fbf;font-size:17px;padding:12px 16px}
.btn.sm{padding:7px 9px;font-size:12px;min-width:40px}
.lead{font-size:13px;color:var(--sub);line-height:1.6;margin:0}
.lead strong{color:var(--text)}
kbd{font-family:var(--body);background:#0b1622;border-radius:4px;padding:1px 5px;font-size:11px;color:var(--gold)}
[hidden]{display:none!important}
@media (max-width:600px){#help{display:none}#slots{max-width:calc(100vw - 225px)}#slots button{width:48px;font-size:10.5px}}
@media (prefers-reduced-motion:reduce){#banner{transition:none}.bar i{transition:none}}
</style>

<div id="game"><canvas id="cv"></canvas></div>
<div id="joy" hidden><div id="knob"></div></div>

<div id="top" class="hud">
  <div id="statusCard">
    <div id="lv">1<small>LEVEL</small></div>
    <div class="bars">
      <div class="bar"><i id="hpFill"></i><span id="hpText">HP</span></div>
      <div class="bar"><i id="xpFill"></i><span id="xpText">EXP</span></div>
    </div>
  </div>
  <div id="rightTop"><div id="beli">0 벨리</div><canvas id="minimap" width="240" height="92"></canvas></div>
</div>

<div id="left" class="hud">
  <div id="quest"><b>퀘스트</b><p id="questText">-</p></div>
  <div class="menuRow"><button class="chip" id="statBtn">스탯<span class="dot" id="statDot" hidden></span></button><button class="chip" id="helpBtn">도움말</button></div>
</div>
<div id="notify" class="hud"></div>
<div id="banner" class="hud"></div>
<div id="slots" class="hud"></div>
<div id="help" class="hud">왼쪽 화면 드래그: 이동</div>

<div id="pad" class="hud">
  <button id="talk" hidden>대화</button>
  <button class="sk" id="skC"></button>
  <button class="sk" id="skX"></button>
  <button class="sk" id="skZ"></button>
  <button class="sk" id="skV"></button>
  <button id="dash">대시</button>
  <button id="atk">공격</button>
</div>

<div id="veil" hidden><div id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle"><header><h2 id="ptitle"></h2><button id="close" aria-label="닫기">✕</button></header><div id="pbody"></div></div></div>

<script>

/* ===================== 설정 (로블록스 Config.lua와 동일 수치) ===================== */
const MAX_LEVEL=300, PTS_PER_LV=3, STAT_SCALE=0.04, START_BELI=300, WALK=22, M1_CD=0.3, FRUIT_PRICE=2500;

const maxHp=(l,d)=>100+(l-1)*8+d*12;
const STATS=["Melee","Defense","Sword","Fruit"];
const STAT_NAME={Melee:"근접",Defense:"방어",Sword:"검술",Fruit:"열매"};
const STAT_DESC={Melee:"주먹 데미지 +4%",Defense:"최대 체력 +12",Sword:"검 데미지 +4%",Fruit:"열매 스킬 데미지 +4%"};

const ISLANDS=[

 {id:"Jungle",name:"정글 섬",x:480,y:-110,r:165,level:10,ground:"#2f7d2c",ground2:"#286c25",shore:"#e0cd92",deco:{tree:40,rock:10}},
 {id:"Desert",name:"사막 섬",x:960,y:80,r:175,level:30,ground:"#e7cf8c",ground2:"#dcc07a",shore:"#c9a467",deco:{cactus:22,rock:8,pyramid:1}},

const ISLAND=Object.fromEntries(ISLANDS.map(i=>[i.id,i]));

const E=(name,level,island,count,shirt,pants,skin,extra={})=>({name,level,island,count,shirt,pants,skin,...extra});
const ENEMIES={

  e.speed=b?18:16; e.atkCd=b?1.1:1.5; e.atkRange=2.6*e.scale+2.2; e.aggro=b?60:45; e.leash=90; e.respawn=b?45:8;
}
const QUESTS={};
for(const [id,e] of Object.entries(ENEMIES)){
  const amt=e.boss?1:6;
  QUESTS[id]={id,target:id,island:e.island,level:Math.max(1,e.level-(e.boss?0:2)),amount:amt,
    xp:Math.floor(e.xp*amt*(e.boss?2:1.5)),beli:Math.floor((100+Math.pow(e.level,1.3)*25)*(e.boss?3:1))};

};

const FRUITS={

function buildWorld(){
  for(const isl of ISLANDS){
    spawns[isl.id]={x:isl.x,y:isl.y};
    const avoid=[{x:isl.x,y:isl.y,r:34}];
    const list=Object.values(ENEMIES).filter(e=>e.island===isl.id).sort((a,b)=>a.level-b.level);
    const start=rr(0,Math.PI*2);
    list.forEach((e,i)=>{
      const a=start+i/list.length*Math.PI*2, d=isl.r*(e.boss?.6:.5);
      const gx=isl.x+Math.cos(a)*d, gy=isl.y+Math.sin(a)*d;
      avoid.push({x:gx,y:gy,r:24});
      if(e.boss) isl.arena={x:gx,y:gy};
      for(let k=0;k<e.count;k++){
        const s=e.boss?0:16, sx=gx+rr(-s,s), sy=gy+rr(-s,s);
        enemies.push({def:e,sx,sy,x:sx,y:sy,hp:e.health,kx:0,ky:0,face:rr(0,6.28),aggro:false,lastAtk:0,stun:0,dead:false,respawnAt:0,burns:[],flash:0,wander:0,atkCount:0,slam:null,anim:rr(0,6)});
      }
    });
    for(const [kind,count] of Object.entries(isl.deco)){
      for(let k=0;k<count;k++){
        for(let t=0;t<30;t++){
          const a=rr(0,Math.PI*2), d=kind==="pyramid"?rr(isl.r*.3,isl.r*.4):rr(30,isl.r*.82);
          const x=isl.x+Math.cos(a)*d, y=isl.y+Math.sin(a)*d;
          if(avoid.some(v=>dist(x,y,v.x,v.y)<v.r)) continue;
          const size=kind==="pyramid"?24:kind==="house"||kind==="tower"?7:rr(2.5,5);
          deco.push({kind,x,y,size,rot:rr(0,6.28),seed:rnd()});
          avoid.push({x,y,r:size+3}); break;
        }
      }
    }
    const roles=["Quest","Travel"];
    if(isl.id==="Starter") roles.push("Fruit","Sword"); else if(isl.id==="Marine"||isl.id==="Desert") roles.push("Sword");
    const corners=[[-14,-14],[14,-14],[-14,14],[14,14]];
    roles.forEach((r,i)=>npcs.push({role:r,island:isl.id,x:isl.x+corners[i][0],y:isl.y+corners[i][1],...NPC_INFO[r]}));
  }
}

function eRadius(e){return 1.7*e.def.scale}
function enemiesIn(x,y,r){return enemies.filter(e=>!e.dead&&dist(x,y,e.x,e.y)<r+eRadius(e))}
function damageEnemy(e,amount,opt={}){
  if(e.dead)return;amount=Math.max(1,Math.floor(amount*(0.9+Math.random()*.2)));
  e.hp-=amount;e.aggro=true;e.flash=.12;dmgText(e.x,e.y-2.5*e.def.scale,amount,opt.color);
  if(e.hp<=0){e.dead=true;e.hp=0;e.respawnAt=now+e.def.respawn;e.burns=[];addFx({type:"sphere",x:e.x,y:e.y,r:5*e.def.scale,color:"#ffffff",life:.45});onKill(e);return}
  const res=e.def.boss?.25:1;
  if(opt.from&&(opt.kb||opt.pull)){let dx=e.x-opt.from.x,dy=e.y-opt.from.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    if(opt.kb){e.kx=dx*opt.kb*.35*res;e.ky=dy*opt.kb*.35*res}
    else{const p=Math.min(opt.pull,l*4)*.5*res;e.kx=-dx*p;e.ky=-dy*p}}
  if(opt.stun)e.stun=Math.max(e.stun,now+(e.def.boss?opt.stun*.4:opt.stun));
  if(opt.burn)e.burns.push({dmg:opt.burn[0]*(opt.mult||1),left:opt.burn[1],next:now+.5});
}

    damageEnemy(e,dmg,{from:{x,y},kb:sk.kb,pull:sk.pull,stun:sk.stun,burn:sk.burn,mult:ctx.mult,color:ctx.kind==="Fruit"?ctx.color:null});n++}return n}
function nearestEnemy(range){let best=null,bd=range;
  for(const e of enemies){if(e.dead)continue;const d=dist(P.x,P.y,e.x,e.y);if(d<bd){bd=d;best=e}}return best}
function aim(range){const t=nearestEnemy(range);

  return{dx:Math.cos(P.face),dy:Math.sin(P.face),tx:P.x+Math.cos(P.face)*15,ty:P.y+Math.sin(P.face)*15}}
function clampTarget(tx,ty,range){const d=dist(P.x,P.y,tx,ty);if(d>range){return{x:P.x+(tx-P.x)/d*range,y:P.y+(ty-P.y)/d*range}}return{x:tx,y:ty}}

 Beam(c,sk,dmg){const x1=P.x+c.dx*2,y1=P.y+c.dy*2,x2=P.x+c.dx*sk.range,y2=P.y+c.dy*sk.range;

};
function lineHit(c,sk,x1,y1,x2,y2,r,dmg){const seen=new Set(),len=dist(x1,y1,x2,y2),n=Math.max(1,Math.ceil(len/(r*.8)));

  const sk={...s.set.M1};if(fin)sk.kb=45;const a=aim(20);

  const a=aim(sk.range?Math.max(30,sk.range):40);const c={...a,color:s.color,kind:w.kind,mult:mult(w)};H[sk.type](c,sk,sk.dmg*c.mult)}

let shakeAmt=0;function shake(a){shakeAmt=Math.max(shakeAmt,a)}
function update(dt){
  // 플레이어
  if(P.dead){if(now>=P.respawnAt){spawnPlayer();notify("부활했습니다","#78dcff")}}
  else{
    let mx=move.x,my=move.y;
    if(keys.has("w")||keys.has("arrowup"))my-=1;if(keys.has("s")||keys.has("arrowdown"))my+=1;
    if(keys.has("a")||keys.has("arrowleft"))mx-=1;if(keys.has("d")||keys.has("arrowright"))mx+=1;
    const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
    const swim=!onIsland(P.x,P.y);let sp=WALK*(swim?.6:1);
    if(now<P.dashUntil){P.x+=P.dashX*95*dt;P.y+=P.dashY*95*dt}
    else if(ml>.05){P.x+=mx*sp*dt;P.y+=my*sp*dt;if(now-P.lastHit>.4)P.face=Math.atan2(my,mx)}
    P.x=clamp(P.x,WORLD.x0,WORLD.x1);P.y=clamp(P.y,WORLD.y0,WORLD.y1);P.moving=ml>.05;P.swim=swim;
    if(holdAtk)attack();
    if(now-P.lastHit>5&&P.hp<pMax())P.hp=Math.min(pMax(),P.hp+pMax()*.02*dt*2);
  }
  // 적
  const alive=!P.dead;
  for(const e of enemies){
    const d=e.def;
    if(e.dead){if(now>=e.respawnAt){Object.assign(e,{dead:false,hp:d.health,x:e.sx,y:e.sy,aggro:false,stun:0,kx:0,ky:0,slam:null})}continue}
    e.flash=Math.max(0,e.flash-dt);e.anim+=dt*6;

    if(e.dead)continue;e.burns=e.burns.filter(b=>b.left>0);
    if(Math.abs(e.kx)+Math.abs(e.ky)>.1){e.x+=e.kx*dt*3;e.y+=e.ky*dt*3;const f=Math.exp(-6*dt);e.kx*=f;e.ky*=f}

      if(alive&&dist(P.x,P.y,s.x,s.y)<s.r){hurt(d.damage*1.6)}}
    if(now<e.stun){e.moving=false;continue}
    const dp=dist(P.x,P.y,e.x,e.y),fromSpawn=dist(e.x,e.y,e.sx,e.sy),pFromSpawn=dist(P.x,P.y,e.sx,e.sy);
    let chase=alive&&pFromSpawn<d.leash&&(e.aggro||dp<d.aggro);

    e.aggro=chase;e.moving=false;
    if(chase){
      e.face=Math.atan2(P.y-e.y,P.x-e.x);
      if(dp>d.atkRange){e.x+=Math.cos(e.face)*d.speed*dt;e.y+=Math.sin(e.face)*d.speed*dt;e.moving=true}
      else if(now-e.lastAtk>=d.atkCd&&!e.slam){e.lastAtk=now;e.atkCount++;
        if(d.boss&&e.atkCount%3===0){e.slam={x:P.x,y:P.y,r:10*d.scale*.7,at:now+.9};addFx({type:"warn",x:P.x,y:P.y,r:e.slam.r,life:.9})}
        else{addFx({type:"slash",x:e.x+Math.cos(e.face)*2*d.scale,y:e.y+Math.sin(e.face)*2*d.scale,ang:e.face,r:3*d.scale,color:d.boss?"#ff5050":"#ffffff",life:.2});hurt(d.damage)}}
    }else{
      if(e.hp<d.health)e.hp=Math.min(d.health,e.hp+d.health*.1*dt);
      if(fromSpawn>4){e.face=Math.atan2(e.sy-e.y,e.sx-e.x);e.x+=Math.cos(e.face)*d.speed*dt;e.y+=Math.sin(e.face)*d.speed*dt;e.moving=true}
    }
  }
  // 적끼리 겹침 방지 (화면 근처만)
  for(let i=0;i<enemies.length;i++){const a=enemies[i];if(a.dead||Math.abs(a.x-P.x)>120)continue;
    for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(b.dead)continue;const dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy),m=eRadius(a)+eRadius(b);
      if(dd<m&&dd>.01){const p=(m-dd)/2;a.x-=dx/dd*p;a.y-=dy/dd*p;b.x+=dx/dd*p;b.y+=dy/dd*p}}}
  // 투사체
  for(let i=projs.length-1;i>=0;i--){const p=projs[i],sk=p.sk,st=sk.speed*dt;p.x+=p.dx*st;p.y+=p.dy*st;p.trav+=st;let done=p.trav>=sk.range;
    if(sk.pierce){if(hitArea(p.c,sk,p.x,p.y,sk.radius,p.dmg,p.seen)>0)addFx({type:"sphere",x:p.x,y:p.y,r:sk.radius,color:p.c.color,life:.2})}

    if(done)projs.splice(i,1)}
  for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>=fx[i].life)fx.splice(i,1)}
  for(let i=texts.length-1;i>=0;i--){texts[i].t+=dt;if(texts[i].t>.8)texts.splice(i,1)}
  shakeAmt*=Math.exp(-10*dt);
  saveTimer+=dt;if(saveTimer>10){saveTimer=0;save()}
}

function drawEntities(){
  const vis=(x,y)=>Math.abs(x-cam.x)<W/S/2+10&&Math.abs(y-cam.y)<Hh/S/2+10;
  for(const n of npcs)if(vis(n.x,n.y))drawChar(n.x,n.y,Math.atan2(cam.y-n.y,cam.x-n.x)*0+Math.atan2(ISLAND[n.island].y-n.y,ISLAND[n.island].x-n.x),1,n.shirt,n.pants,"#eab892");
  for(const e of enemies){if(e.dead||!vis(e.x,e.y))continue;const d=e.def;
    drawChar(e.x,e.y,e.face,d.scale,d.shirt,d.pants,d.skin,{moving:e.moving,anim:e.anim,flash:e.flash>0,glow:now<e.stun?"#8cdcff":e.burns.length?"#ff7814":null})}
  if(!P.dead){const w=curWeapon();drawChar(P.x,P.y,P.face,1,"#3c78dc","#28283c","#eab892",{moving:P.moving,anim:now*12,swim:P.swim,
    sword:w.kind==="Sword"?SWORDS[w.id].color:null,glow:w.kind==="Fruit"?FRUITS[w.id].color:null,flash:P.hurtT&&now-P.hurtT<.1})}
  for(const p of projs){const s=p.sk.size/2;ctx.globalAlpha=.35;circle(p.x-p.dx*s*1.5,p.y-p.dy*s*1.5,s*.8,p.c.color);ctx.globalAlpha=1;circle(p.x,p.y,s,p.c.color);circle(p.x,p.y,s*.5,"#ffffff")}
}
function drawFx(){
  for(const f of fx){const k=f.t/f.life;ctx.globalAlpha=1-k;
    switch(f.type){
    case"sphere":ctx.globalAlpha=f.solid?(1-k)*.8:(1-k)*.55;circle(f.x,f.y,Math.max(.1,f.r*(f.solid?1-k*.3:.3+k*.7)),f.color);break;
    case"ring":ctx.globalAlpha=f.hold?.6:1-k;ctx.beginPath();ctx.arc(f.x,f.y,f.hold?f.r0:f.r0+(f.r1-f.r0)*k,0,6.283);ctx.strokeStyle=f.color;ctx.lineWidth=f.hold?.4:.8;ctx.stroke();break;
    case"beam":ctx.strokeStyle=f.color;ctx.lineCap="round";ctx.lineWidth=f.w*(1-k);ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();
      ctx.strokeStyle="#ffffff";ctx.lineWidth=f.w*.35*(1-k);ctx.stroke();break;
    case"slash":ctx.strokeStyle=f.color;ctx.lineCap="round";ctx.lineWidth=f.r*.35*(1-k);ctx.beginPath();ctx.arc(f.x-Math.cos(f.ang)*f.r*.4,f.y-Math.sin(f.ang)*f.r*.4,f.r,f.ang-1.1,f.ang+1.1);ctx.stroke();break;
    case"drop":ctx.strokeStyle=f.color;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(f.x,f.y-30*(1-k));ctx.lineTo(f.x,f.y-30*(1-k)-8);ctx.stroke();break;
    case"warn":ctx.globalAlpha=.25+.35*k;circle(f.x,f.y,f.r,"#ff2a20");ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(f.x,f.y,f.r*k,0,6.283);ctx.strokeStyle="#ff6050";ctx.lineWidth=.4;ctx.stroke();break;}
  }ctx.globalAlpha=1}
function drawLabels(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.textAlign="center";ctx.lineJoin="round";
  const label=(t,x,y,size,color,font)=>{ctx.font=`${size}px ${font||"Jua, sans-serif"}`;ctx.lineWidth=3;ctx.strokeStyle="rgba(0,0,0,.75)";ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y)};
  for(const i of ISLANDS){const[x,y]=w2s(i.x,i.y-30);if(x<-200||x>W+200||y<-50||y>Hh+50)continue;label(`${i.name}  Lv.${i.level}+`,x,y,22,"#ffffff")}
  for(const n of npcs){const[x,y]=w2s(n.x,n.y-3.2);if(x<-80||x>W+80||y<-30||y>Hh+30)continue;label(n.title,x,y,13,n.color)}
  for(const e of enemies){if(e.dead)continue;const d=e.def;const[x,y]=w2s(e.x,e.y-2.4*d.scale-1.6);if(x<-80||x>W+80||y<-30||y>Hh+30)continue;
    label(`[Lv.${d.level}] ${d.name}`,x,y-7,d.boss?14:12,d.boss?"#ff7070":"#ffffff");
    const bw=d.boss?70:46;ctx.fillStyle="#141414";ctx.fillRect(x-bw/2,y-2,bw,5);ctx.fillStyle=d.boss?"#ff5050":"#50dc5a";ctx.fillRect(x-bw/2,y-2,bw*clamp(e.hp/d.health,0,1),5)}
  for(const t of texts){const[x,y]=w2s(t.x,t.y);label(t.text,x,y-t.t*40,18+(t.t<.1?6:0),t.color,"Jua, sans-serif")}
  if(P.dead){ctx.fillStyle="rgba(80,0,0,.25)";ctx.fillRect(0,0,W,Hh);label(`부활까지 ${Math.ceil(P.respawnAt-now)}초`,W/2,Hh/2,30,"#ffb0a0")}
}
const mm=$("minimap"),mctx=mm.getContext("2d");
function drawMinimap(){const w=mm.width,h=mm.height,sx=w/(WORLD.x1-WORLD.x0),sy=h/(WORLD.y1-WORLD.y0);
  mctx.fillStyle="#0a3554";mctx.fillRect(0,0,w,h);
  for(const i of ISLANDS){mctx.beginPath();mctx.arc((i.x-WORLD.x0)*sx,(i.y-WORLD.y0)*sy,i.r*sx,0,6.283);mctx.fillStyle=D.level>=i.level?i.ground:"#4a5566";mctx.fill()}
  mctx.beginPath();mctx.arc((P.x-WORLD.x0)*sx,(P.y-WORLD.y0)*sy,5,0,6.283);mctx.fillStyle="#ffc94a";mctx.fill();mctx.strokeStyle="#000";mctx.lineWidth=2;mctx.stroke()}

/* ===================== 루프 ===================== */
let prev=performance.now()/1000;
function frame(t){const s=t/1000,dt=Math.min(.05,s-prev);prev=s;now+=dt;
  if($("veil").hidden)update(dt);
  cam.x+=(P.x-cam.x)*Math.min(1,dt*8);cam.y+=(P.y-cam.y)*Math.min(1,dt*8);
  const sx=(Math.random()-.5)*shakeAmt,sy=(Math.random()-.5)*shakeAmt;cam.x+=sx/S;cam.y+=sy/S;
  drawWorld();drawEntities();drawFx();drawLabels();cam.x-=sx/S;cam.y-=sy/S;
  updateHud();drawMinimap();requestAnimationFrame(frame)}
refreshSlots();refreshSkills();
cam.x=P.x;cam.y=P.y;
if(!D.seen)openHelp();
requestAnimationFrame(t=>{prev=t/1000;frame(t)});
</script>
