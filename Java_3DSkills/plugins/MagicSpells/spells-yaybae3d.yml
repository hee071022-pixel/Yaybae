# ════════════════════════════════════════════════════════════════════
#  Yaybae 3D 스킬 팩  ─  MagicSpells + ItemsAdder  (Minecraft Java 1.20.4)
#
#  원리: ItemsAdder 가 3D 모델(종이 + CustomModelData)을 리소스팩에 넣고,
#        MagicSpells 가 item_display 엔티티를 소환해 그 모델을 씌운 뒤
#        transformation 보간(interpolation)으로 회전/낙하/확대 애니메이션을 줍니다.
#
#  모델 번호 (ItemsAdder items.yml 의 model_id 와 같아야 함)
#    31001 = 천공의 대검   31002 = 마법진   31003 = 초승달 참격
#
#  %a = 시전자 이름 (태그를 플레이어별로 분리해 여러 명이 동시에 써도 안 섞임)
#  대미지는 몹에게만 들어갑니다 (type=!player). PvP 를 원하면 README 참고.
# ════════════════════════════════════════════════════════════════════

# ───────────────────────── 1. 초승달 참격 ─────────────────────────
yb_slash:
  spell-class: ".MultiSpell"
  name: yb_slash
  description: 앞쪽을 거대한 3D 초승달 검기로 베어냅니다.
  cooldown: 1.5
  cost:
    - mana 10
  str-cast-self: "&b✦ 초승달 참격!"
  str-on-cooldown: "&7참격 재사용 대기중..."
  spells:
    - yb_slash_spawn
    - DELAY 2
    - yb_slash_swing
    - DELAY 6
    - yb_slash_fade
    - DELAY 4
    - yb_slash_kill

yb_slash_spawn:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'execute at %a anchored eyes positioned ^ ^-0.5 ^2 run summon minecraft:item_display ~ ~ ~ {Tags:["yb3d","yb_slash_%a","yb_fresh_%a"],item_display:"none",billboard:"fixed",brightness:{sky:15,block:15},item:{id:"minecraft:paper",Count:1b,tag:{CustomModelData:31003}},transformation:{left_rotation:[0f,-0.5f,0f,0.866f],right_rotation:[0f,0f,0.1736f,0.9848f],translation:[0f,0f,0f],scale:[2f,2f,2f]}}'
    - 'execute as @e[type=minecraft:item_display,tag=yb_fresh_%a] at @s rotated as %a run tp @s ~ ~ ~ ~ 0'
    - 'tag @e[type=minecraft:item_display,tag=yb_fresh_%a] remove yb_fresh_%a'
    - 'execute at %a run playsound minecraft:entity.player.attack.sweep player @a ~ ~ ~ 1 0.6'

yb_slash_swing:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    # -60° → +60° 로 휘두르며 커짐 (5틱 보간)
    - 'execute as @e[type=minecraft:item_display,tag=yb_slash_%a] run data merge entity @s {start_interpolation:0,interpolation_duration:5,transformation:{left_rotation:[0f,0.5f,0f,0.866f],right_rotation:[0f,0f,0.1736f,0.9848f],translation:[0f,0f,0f],scale:[3.4f,3.4f,3.4f]}}'
    - 'execute at %a anchored eyes positioned ^ ^-0.5 ^2.5 run particle minecraft:sweep_attack ~ ~ ~ 1.3 0.2 1.3 0 6 force'
    - 'execute at %a anchored eyes positioned ^ ^-0.5 ^2.5 run particle minecraft:end_rod ~ ~ ~ 1.6 0.3 1.6 0.05 30 force'
    - 'execute at %a run playsound minecraft:item.trident.throw player @a ~ ~ ~ 1 1.4'
    - 'execute at %a positioned ^ ^ ^2.5 as @e[distance=..3.2,type=!minecraft:player,type=!minecraft:item_display,type=!minecraft:item,type=!minecraft:experience_orb,type=!minecraft:armor_stand] run damage @s 9 minecraft:player_attack by %a'

yb_slash_fade:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'execute as @e[type=minecraft:item_display,tag=yb_slash_%a] run data merge entity @s {start_interpolation:0,interpolation_duration:4,transformation:{left_rotation:[0f,0.7071f,0f,0.7071f],right_rotation:[0f,0f,0.1736f,0.9848f],translation:[0f,0f,0f],scale:[0f,0f,0f]}}'

yb_slash_kill:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'kill @e[type=minecraft:item_display,tag=yb_slash_%a]'


# ───────────────────────── 2. 아케인 서클 ─────────────────────────
# 발밑에 회전하는 3층 3D 마법진 → 3번 맥동 대미지 → 마지막에 폭발하며 띄움
yb_circle:
  spell-class: ".MultiSpell"
  name: yb_circle
  description: 발밑에 회전하는 마법진을 펼쳐 주변 적을 연속 타격합니다.
  cooldown: 8
  cost:
    - mana 35
  str-cast-self: "&d✦ 아케인 서클!"
  str-on-cooldown: "&7마법진 재사용 대기중..."
  spells:
    - yb_circle_spawn
    - DELAY 1
    - yb_circle_rot90
    - DELAY 5
    - yb_circle_rot180
    - yb_circle_pulse
    - DELAY 5
    - yb_circle_rot270
    - DELAY 5
    - yb_circle_rot0
    - yb_circle_pulse
    - DELAY 5
    - yb_circle_rot90
    - DELAY 5
    - yb_circle_rot180
    - yb_circle_burst
    - DELAY 5
    - yb_circle_fade
    - DELAY 6
    - yb_circle_kill

yb_circle_spawn:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'execute at %a positioned ~ ~0.05 ~ run summon minecraft:item_display ~ ~ ~ {Tags:["yb3d","yb_circle_%a"],item_display:"none",billboard:"fixed",brightness:{sky:15,block:15},item:{id:"minecraft:paper",Count:1b,tag:{CustomModelData:31002}},transformation:{left_rotation:[0f,0f,0f,1f],right_rotation:[0f,0f,0f,1f],translation:[0f,0f,0f],scale:[0.1f,0.1f,0.1f]}}'
    - 'execute at %a run playsound minecraft:block.beacon.activate player @a ~ ~ ~ 1 1.6'
    - 'execute at %a run playsound minecraft:entity.evoker.prepare_summon player @a ~ ~ ~ 0.8 1.2'

# 90° 씩 끊어서 회전 (보간은 최단 경로라 180° 미만으로 나눠야 계속 한 방향으로 돔)
yb_circle_rot90:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'execute as @e[type=minecraft:item_display,tag=yb_circle_%a] run data merge entity @s {start_interpolation:0,interpolation_duration:5,transformation:{left_rotation:[0f,0.7071f,0f,0.7071f],right_rotation:[0f,0f,0f,1f],translation:[0f,0f,0f],scale:[3.5f,3.5f,3.5f]}}'

yb_circle_rot180:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'execute as @e[type=minecraft:item_display,tag=yb_circle_%a] run data merge entity @s {start_interpolation:0,interpolation_duration:5,transformation:{left_rotation:[0f,1f,0f,0f],right_rotation:[0f,0f,0f,1f],translation:[0f,0f,0f],scale:[3.5f,3.5f,3.5f]}}'

yb_circle_rot270:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'execute as @e[type=minecraft:item_display,tag=yb_circle_%a] run data merge entity @s {start_interpolation:0,interpolation_duration:5,transformation:{left_rotation:[0f,0.7071f,0f,-0.7071f],right_rotation:[0f,0f,0f,1f],translation:[0f,0f,0f],scale:[3.5f,3.5f,3.5f]}}'

yb_circle_rot0:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'execute as @e[type=minecraft:item_display,tag=yb_circle_%a] run data merge entity @s {start_interpolation:0,interpolation_duration:5,transformation:{left_rotation:[0f,0f,0f,1f],right_rotation:[0f,0f,0f,1f],translation:[0f,0f,0f],scale:[3.5f,3.5f,3.5f]}}'

yb_circle_pulse:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'execute at @e[type=minecraft:item_display,tag=yb_circle_%a] run particle minecraft:witch ~ ~0.3 ~ 2.2 0.1 2.2 0 60 force'
    - 'execute at @e[type=minecraft:item_display,tag=yb_circle_%a] run particle minecraft:portal ~ ~0.2 ~ 2 0.2 2 0.6 80 force'
    - 'execute at @e[type=minecraft:item_display,tag=yb_circle_%a] run playsound minecraft:block.amethyst_block.chime player @a ~ ~ ~ 1.5 0.7'
    - 'execute at @e[type=minecraft:item_display,tag=yb_circle_%a] as @e[distance=..3.5,type=!minecraft:player,type=!minecraft:item_display,type=!minecraft:item,type=!minecraft:experience_orb,type=!minecraft:armor_stand] run damage @s 4 minecraft:magic by %a'
    - 'execute at @e[type=minecraft:item_display,tag=yb_circle_%a] as @e[distance=..3.5,type=!minecraft:player,type=!minecraft:item_display,type=!minecraft:item,type=!minecraft:experience_orb,type=!minecraft:armor_stand] run effect give @s minecraft:slowness 1 2 true'

yb_circle_burst:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'execute at @e[type=minecraft:item_display,tag=yb_circle_%a] run particle minecraft:explosion ~ ~0.5 ~ 1.5 0.3 1.5 0 6 force'
    - 'execute at @e[type=minecraft:item_display,tag=yb_circle_%a] run particle minecraft:end_rod ~ ~0.3 ~ 0.3 0.1 0.3 0.4 120 force'
    - 'execute at @e[type=minecraft:item_display,tag=yb_circle_%a] run particle minecraft:dragon_breath ~ ~0.3 ~ 2.5 0.4 2.5 0.02 80 force'
    - 'execute at @e[type=minecraft:item_display,tag=yb_circle_%a] run playsound minecraft:entity.evoker.cast_spell player @a ~ ~ ~ 1.5 0.8'
    - 'execute at @e[type=minecraft:item_display,tag=yb_circle_%a] run playsound minecraft:entity.generic.explode player @a ~ ~ ~ 1 1.3'
    - 'execute at @e[type=minecraft:item_display,tag=yb_circle_%a] as @e[distance=..3.5,type=!minecraft:player,type=!minecraft:item_display,type=!minecraft:item,type=!minecraft:experience_orb,type=!minecraft:armor_stand] run damage @s 10 minecraft:magic by %a'
    - 'execute at @e[type=minecraft:item_display,tag=yb_circle_%a] as @e[distance=..3.5,type=!minecraft:player,type=!minecraft:item_display,type=!minecraft:item,type=!minecraft:experience_orb,type=!minecraft:armor_stand] run effect give @s minecraft:levitation 1 3 true'

yb_circle_fade:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'execute as @e[type=minecraft:item_display,tag=yb_circle_%a] run data merge entity @s {start_interpolation:0,interpolation_duration:6,transformation:{left_rotation:[0f,0.7071f,0f,-0.7071f],right_rotation:[0f,0f,0f,1f],translation:[0f,0f,0f],scale:[0f,0f,0f]}}'

yb_circle_kill:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'kill @e[type=minecraft:item_display,tag=yb_circle_%a]'


# ───────────────────────── 3. 천공의 대검 ─────────────────────────
# 7칸 앞 지면에 경고 마법진 → 하늘에서 거대한 3D 대검이 떨어져 꽂힘 → 폭발 → 땅속으로 가라앉음
yb_heavenblade:
  spell-class: ".MultiSpell"
  name: yb_heavenblade
  description: 하늘에서 거대한 대검을 떨어뜨려 지면을 내려찍습니다.
  cooldown: 12
  cost:
    - mana 60
  str-cast-self: "&e✦ 천공의 대검!"
  str-on-cooldown: "&7대검 재사용 대기중..."
  spells:
    - yb_hb_spawn
    - DELAY 1
    - yb_hb_warn
    - DELAY 14
    - yb_hb_fall
    - DELAY 5
    - yb_hb_impact
    - DELAY 30
    - yb_hb_sink
    - DELAY 20
    - yb_hb_kill

yb_hb_spawn:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    # 대검: 땅 위치에 소환하되 translation 으로 21칸 위에 띄워둠 (엔티티 좌표 = 착탄 지점)
    - 'execute at %a rotated ~ 0 positioned ^ ^ ^7 positioned over motion_blocking_no_leaves run summon minecraft:item_display ~ ~ ~ {Tags:["yb3d","yb_hb_%a","yb_fresh_%a"],item_display:"none",billboard:"fixed",brightness:{sky:15,block:15},item:{id:"minecraft:paper",Count:1b,tag:{CustomModelData:31001}},transformation:{left_rotation:[0f,0f,0f,1f],right_rotation:[0f,0f,0f,1f],translation:[0f,21f,0f],scale:[2.5f,2.5f,2.5f]}}'
    # 경고 마법진
    - 'execute at %a rotated ~ 0 positioned ^ ^ ^7 positioned over motion_blocking_no_leaves positioned ~ ~0.05 ~ run summon minecraft:item_display ~ ~ ~ {Tags:["yb3d","yb_hbc_%a"],item_display:"none",billboard:"fixed",brightness:{sky:15,block:15},item:{id:"minecraft:paper",Count:1b,tag:{CustomModelData:31002}},transformation:{left_rotation:[0f,0f,0f,1f],right_rotation:[0f,0f,0f,1f],translation:[0f,0f,0f],scale:[0.1f,0.1f,0.1f]}}'
    - 'execute as @e[type=minecraft:item_display,tag=yb_fresh_%a] at @s rotated as %a run tp @s ~ ~ ~ ~ 0'
    - 'tag @e[type=minecraft:item_display,tag=yb_fresh_%a] remove yb_fresh_%a'
    - 'execute at %a run playsound minecraft:block.beacon.power_select player @a ~ ~ ~ 1.2 0.6'

yb_hb_warn:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'execute as @e[type=minecraft:item_display,tag=yb_hbc_%a] run data merge entity @s {start_interpolation:0,interpolation_duration:14,transformation:{left_rotation:[0f,0.7071f,0f,0.7071f],right_rotation:[0f,0f,0f,1f],translation:[0f,0f,0f],scale:[2.6f,2.6f,2.6f]}}'
    - 'execute at @e[type=minecraft:item_display,tag=yb_hb_%a] run particle minecraft:enchant ~ ~0.5 ~ 2 0.5 2 1 120 force'
    - 'execute at @e[type=minecraft:item_display,tag=yb_hb_%a] run playsound minecraft:block.respawn_anchor.charge player @a ~ ~ ~ 1.5 0.8'

yb_hb_fall:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    # 21 → 3 (끝이 땅에 약 0.8칸 박힘), 5틱 만에 낙하
    - 'execute as @e[type=minecraft:item_display,tag=yb_hb_%a] run data merge entity @s {start_interpolation:0,interpolation_duration:5,transformation:{left_rotation:[0f,0f,0f,1f],right_rotation:[0f,0f,0f,1f],translation:[0f,3f,0f],scale:[2.5f,2.5f,2.5f]}}'
    - 'execute at @e[type=minecraft:item_display,tag=yb_hb_%a] run playsound minecraft:item.trident.riptide_3 player @a ~ ~10 ~ 2 0.6'

yb_hb_impact:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'execute at @e[type=minecraft:item_display,tag=yb_hb_%a] run particle minecraft:explosion_emitter ~ ~0.5 ~ 0 0 0 0 1 force'
    - 'execute at @e[type=minecraft:item_display,tag=yb_hb_%a] run particle minecraft:flash ~ ~1 ~ 0 0 0 0 1 force'
    - 'execute at @e[type=minecraft:item_display,tag=yb_hb_%a] run particle minecraft:end_rod ~ ~0.5 ~ 0.5 0.2 0.5 0.6 150 force'
    - 'execute at @e[type=minecraft:item_display,tag=yb_hb_%a] run particle minecraft:cloud ~ ~0.2 ~ 3 0.1 3 0.05 80 force'
    - 'execute at @e[type=minecraft:item_display,tag=yb_hb_%a] run playsound minecraft:entity.lightning_bolt.thunder player @a ~ ~ ~ 2 0.9'
    - 'execute at @e[type=minecraft:item_display,tag=yb_hb_%a] run playsound minecraft:entity.generic.explode player @a ~ ~ ~ 2 0.7'
    - 'execute at @e[type=minecraft:item_display,tag=yb_hb_%a] as @e[distance=..4.5,type=!minecraft:player,type=!minecraft:item_display,type=!minecraft:item,type=!minecraft:experience_orb,type=!minecraft:armor_stand] run damage @s 18 minecraft:magic by %a'
    - 'execute at @e[type=minecraft:item_display,tag=yb_hb_%a] as @e[distance=..4.5,type=!minecraft:player,type=!minecraft:item_display,type=!minecraft:item,type=!minecraft:experience_orb,type=!minecraft:armor_stand] run effect give @s minecraft:levitation 1 4 true'
    # 마법진은 충격파처럼 확 퍼졌다 사라짐
    - 'execute as @e[type=minecraft:item_display,tag=yb_hbc_%a] run data merge entity @s {start_interpolation:0,interpolation_duration:8,transformation:{left_rotation:[0f,1f,0f,0f],right_rotation:[0f,0f,0f,1f],translation:[0f,0f,0f],scale:[5f,0f,5f]}}'

yb_hb_sink:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'execute as @e[type=minecraft:item_display,tag=yb_hb_%a] run data merge entity @s {start_interpolation:0,interpolation_duration:20,transformation:{left_rotation:[0f,0f,0f,1f],right_rotation:[0f,0f,0f,1f],translation:[0f,-4.5f,0f],scale:[2.5f,2.5f,2.5f]}}'
    - 'execute at @e[type=minecraft:item_display,tag=yb_hb_%a] run particle minecraft:end_rod ~ ~1.5 ~ 0.3 1.5 0.3 0.02 40 force'
    - 'execute at @e[type=minecraft:item_display,tag=yb_hb_%a] run playsound minecraft:block.beacon.deactivate player @a ~ ~ ~ 1 0.8'

yb_hb_kill:
  spell-class: ".ExternalCommandSpell"
  helper-spell: true
  execute-on-console-instead: true
  str-cast-self: ""
  command-to-execute:
    - 'kill @e[type=minecraft:item_display,tag=yb_hb_%a]'
    - 'kill @e[type=minecraft:item_display,tag=yb_hbc_%a]'


# ───────────────────────── 관리자용 ─────────────────────────
# 서버가 스킬 도중 꺼지거나 리로드돼 모델이 남았을 때: /c yb_cleanup
yb_cleanup:
  spell-class: ".ExternalCommandSpell"
  name: yb_cleanup
  permission: magicspells.cast.yb_cleanup
  execute-on-console-instead: true
  str-cast-self: "&7남아있는 3D 스킬 모델을 정리했습니다."
  command-to-execute:
    - 'kill @e[type=minecraft:item_display,tag=yb3d]'
