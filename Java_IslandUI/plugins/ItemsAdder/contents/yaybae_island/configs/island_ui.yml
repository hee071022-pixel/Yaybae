info:
  namespace: yaybae_island

font_images:
  # 상자(6줄) GUI 전체를 덮는 배경. 메뉴 제목에서 %img_island_menu% 로 사용
  island_menu:
    path: gui/island_menu.png
    show_in_gui: false
    y_position: 13
    scale_ratio: 222

